<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buscador de palabras</title>
  </head>
  <body>
    <main class="container app">
      <header class="app__header">
        <h1 class="app__title">Buscador de palabras</h1>
        <p class="app__subtitle">
          Pega un texto, escribe una palabra o carácter y cuenta cuántas veces aparece.
          No distingue mayúsculas de minúsculas.
        </p>
      </header>

      <div id="alert-area" aria-live="assertive"></div>

      <div class="row g-4">
        <section class="col-lg-5">
          <form id="search-form" class="panel" novalidate>
            <div class="mb-3">
              <label for="text-input" class="form-label">Texto</label>
              <textarea id="text-input" class="form-control" rows="10"
                placeholder="Escribe o pega aquí el texto completo…"></textarea>
            </div>

            <div class="mb-3">
              <label for="term-input" class="form-label">Palabra o carácter a buscar</label>
              <input id="term-input" type="text" class="form-control"
                placeholder="Ej. autómata" autocomplete="off" />
            </div>

            <div class="mb-4">
              <label for="replace-input" class="form-label">Reemplazar por</label>
              <input id="replace-input" type="text" class="form-control"
                placeholder="Ej. máquina" autocomplete="off" />
            </div>

            <div class="d-flex gap-2">
              <button type="submit" id="search-btn" class="btn btn-search">Buscar</button>
              <button type="button" id="replace-btn" class="btn btn-replace">Reemplazar</button>
              <button type="button" id="clear-btn" class="btn btn-outline-secondary">Limpiar</button>
            </div>
          </form>
        </section>

        <section class="col-lg-7">
          <div class="panel panel--result" aria-live="polite">
            <div id="counter" class="counter" hidden>
              <span id="counter-number" class="counter__number">0</span>
              <span id="counter-label" class="counter__label"></span>
            </div>
            <div id="result-text" class="result-text result-text--empty">
              El texto con las coincidencias marcadas aparecerá aquí.
            </div>
          </div>
        </section>
      </div>
    </main>
    <!-- Sin <link> ni <script>: webpack los inyecta -->
  </body>
</html>
